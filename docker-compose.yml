services:

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    depends_on:
      - mysql
      - redis

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    depends_on:
      - mysql
      - redis

  chrome:
    image: selenium/standalone-chrome
    ports:
      - "4444:4444"
    shm_size: 4gb
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=scrapkit
      - MYSQL_ROOT_PASSWORD=root535455
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine

volumes:
  mysql_data: