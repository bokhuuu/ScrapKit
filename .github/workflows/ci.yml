# Runs on every push and pull request to main.
# Checks code formatting with Pint, then runs the full Pest test suite.
# If either step fails the push is marked as failed on GitHub.
#
# No MySQL/Redis services needed: phpunit.xml configures SQLite in-memory
# for all DB access, and feature tests use Bus::fake() so job middleware
# (including Redis-backed RateLimitedMiddleware) never actually executes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, sqlite3, pdo_sqlite, redis, pcntl, mbstring, zip, gd, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Check code formatting
        run: ./vendor/bin/pint --test

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test
